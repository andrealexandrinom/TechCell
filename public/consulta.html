<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechCell – Consulta de OS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f6f9}</style>
</head>
<body>
<div class="container py-4" style="max-width:480px">
  <h4 class="text-center mb-3">📱 TechCell – Acompanhe seu aparelho</h4>
  <form id="f" class="card card-body shadow-sm mb-3">
    <label class="form-label">Número da OS (protocolo)</label>
    <input name="protocolo" type="number" class="form-control mb-2" required>
    <label class="form-label">Telefone cadastrado (com DDD)</label>
    <input name="telefone" class="form-control mb-3" required placeholder="27999990000">
    <button class="btn btn-primary">Consultar</button>
  </form>
  <div id="r"></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const q = new URLSearchParams(new FormData(e.target));
  const r = await fetch('/api/publico/os?' + q), j = await r.json();
  const out = document.getElementById('r');
  if (!r.ok) return out.innerHTML = `<div class="alert alert-danger">${esc(j.erro)}</div>`;
  out.innerHTML = `<div class="card card-body shadow-sm">
    <div class="text-muted small">OS #${j.protocolo} – ${esc(j.aparelho)}</div>
    <h5 class="mb-3">Status atual: <span class="badge text-bg-primary">${esc(j.status)}</span></h5>
    <ul class="list-group mb-3">${j.historico.map(h => `<li class="list-group-item d-flex justify-content-between"><span>${esc(h.status)}</span><span class="small text-muted">${new Date(h.data).toLocaleString('pt-BR')}</span></li>`).join('')}</ul>
    ${j.itens.length ? `<h6>Orçamento</h6><ul class="mb-1">${j.itens.map(i => `<li>${esc(i.descricao)} (${i.quantidade}x) – ${brl(i.valor)}</li>`).join('')}</ul><p><b>Total: ${brl(j.total)}</b></p>` : '<p class="text-muted">Orçamento ainda não disponível.</p>'}
    <a class="btn btn-success" target="_blank" href="https://wa.me/5500000000000?text=${encodeURIComponent('Olá! Gostaria de falar sobre a OS #' + j.protocolo)}">Falar com a loja no WhatsApp</a>
  </div>`;
};
</script>
</body>
</html>
